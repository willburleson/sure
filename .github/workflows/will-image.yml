# Fork-only: test, then build the arm64 image that runs on sure.willburleson.com.
#
# The `will` branch is an upstream release tag plus a small stack of local
# patches (see FORK.md). Every push runs upstream's CI, then publishes
#   ghcr.io/willburleson/sure:<upstream version>-will.<short sha>
#   ghcr.io/willburleson/sure:will   (latest build)
# sure-oci's bin/update.sh deploys the versioned tag.

name: Will image

on:
  push:
    branches: [will]
  workflow_dispatch:

concurrency:
  group: will-image
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: tag
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          echo "version=${base#v}-will.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/arm64
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/willburleson/sure:cache-arm64
          cache-to: type=registry,ref=ghcr.io/willburleson/sure:cache-arm64,mode=max
          labels: org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          provenance: false
          push: true
          tags: |
            ghcr.io/willburleson/sure:${{ steps.tag.outputs.version }}
            ghcr.io/willburleson/sure:will

      - run: echo "Published ghcr.io/willburleson/sure:${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
