  chase_ur:        { name: Chase Ultimate Rewards, unit: points }
  amex_mr:         { name: Amex Membership Rewards, unit: points }
  citi_ty:         { name: Citi ThankYou, unit: points }
  capital_one:     { name: Capital One Miles, unit: points }
  capital_one_cash: { name: Capital One Cash, unit: cash }
  chase_cash:      { name: Chase Cash Back, unit: cash }
  bilt:            { name: Bilt Points, unit: points }
  bofa:            { name: Bank of America Points, unit: points }
  wells_fargo:     { name: Wells Fargo Rewards, unit: points }
  us_bank:         { name: U.S. Bank Rewards, unit: points }
  discover:        { name: Discover Cashback, unit: cash }
  alaska:          { name: Alaska Atmos Rewards, unit: points }
  american:        { name: American AAdvantage, unit: points }
  delta:           { name: Delta SkyMiles, unit: points }
  united:          { name: United MileagePlus, unit: points }
  southwest:       { name: Southwest Rapid Rewards, unit: points }
  hyatt:           { name: World of Hyatt, unit: points }
  marriott:        { name: Marriott Bonvoy, unit: points }
  hilton:          { name: Hilton Honors, unit: points }

categories:
  dining:     [restaurant, dining, coffee, food & drink]
  travel:     [travel, flight, lodging, hotel, airline, rental car]
  flights:    [flight, airline]
  hotels:     [lodging, hotel]
  groceries:  [grocer, supermarket]
  gas:        [gas, fuel]
  transit:    [transit, rideshare, taxi, subway]
  streaming:  [streaming]
  drugstore:  [pharmacy, drugstore]
  phone:      [phone & internet]
  rent:       [rent]

issuers:
  chase:
    name: Chase
    rules:
      - { type: five_24 }
      - { type: velocity, max: 2, days: 30, scope: issuer, note: "Chase rarely approves more than 2 cards in 30 days" }
      - { type: velocity, max: 1, days: 90, scope: issuer_business, note: "Space Ink applications about 90 days apart" }
  amex:
    name: American Express
    rules:
      - { type: velocity, max: 1, days: 5, scope: issuer, note: "Amex 1 card per 5 days" }
      - { type: velocity, max: 2, days: 90, scope: issuer, note: "Amex 2 credit cards per 90 days" }
      - { type: lifetime, scope: product, note: "Amex bonus once per lifetime per card (pop-up)" }
  citi:
    name: Citi
    rules:
      - { type: velocity, max: 1, days: 8, scope: issuer, note: "Citi 1 card per 8 days" }
      - { type: velocity, max: 2, days: 65, scope: issuer, note: "Citi 2 cards per 65 days" }
      - { type: velocity, max: 1, days: 95, scope: issuer_business, note: "Citi 1 business card per 95 days" }
      - { type: cooldown, months: 48, scope: product, from: bonus, note: "Citi 48 months since this card's last bonus" }
  capital_one:
    name: Capital One
    rules:
      - { type: velocity, max: 1, days: 182, scope: issuer_personal, note: "Capital One about 1 personal card per 6 months" }
      - { type: cooldown, months: 48, scope: product, from: bonus, note: "Capital One 48 months since this card's last bonus" }
  bofa:
    name: Bank of America
    rules:
      - { type: velocity, max: 2, days: 60, scope: issuer_personal, note: "BofA 2/3/4: 2 personal cards per 2 months" }
      - { type: velocity, max: 3, days: 365, scope: issuer_personal, note: "BofA 2/3/4: 3 personal cards per 12 months" }
      - { type: velocity, max: 4, days: 730, scope: issuer_personal, note: "BofA 2/3/4: 4 personal cards per 24 months" }
      - { type: not_holding, scope: product, note: "BofA: not available while you have this card" }
      - { type: cooldown, months: 24, scope: product, from: close, note: "BofA: not available if you had this card in the past 24 months (from closing)" }
  barclays:
    name: Barclays
    rules:
      - { type: velocity, max: 6, days: 730, scope: all_524, note: "Barclays 6/24 (soft)" }
      - { type: not_holding, scope: product, note: "Barclays: no bonus while holding this card" }
      - { type: cooldown, months: 24, scope: product, from: bonus, note: "Barclays 24 months since this card's last bonus" }
  us_bank:
    name: U.S. Bank
    rules:
      - { type: velocity, max: 2, days: 365, scope: all_524, note: "U.S. Bank dislikes more than about 2 new cards in 12 months" }
  wells_fargo:
    name: Wells Fargo
    rules:
      - { type: velocity, max: 1, days: 182, scope: issuer, note: "Wells Fargo 1 card per 6 months" }
      - { type: not_holding, scope: product, note: "Wells Fargo: no bonus while you hold this card" }
      - { type: cooldown, months: 48, scope: product, from: open, note: "Wells Fargo: no bonus if you opened this card in the past 48 months" }
  bilt:
    name: Bilt
    rules: []
  discover:
    name: Discover
    rules:
      - { type: lifetime, scope: issuer, note: "Discover first-year match once per lifetime" }
  other:
    name: Other
    rules: []

products:
