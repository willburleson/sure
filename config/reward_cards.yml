  chase_world_of_hyatt:
    { name: Chase World of Hyatt, issuer: chase, program: hyatt,
      earn: { base: 1, dining: 2, transit: 2 }, rules: *chase_personal }
  chase_southwest_priority:
    { name: Chase Southwest Priority, issuer: chase, family: southwest, program: southwest,
      earn: { base: 1, flights: 3, hotels: 2, transit: 2 }, rules: *chase_personal }
  chase_other:
    { name: Chase (other), issuer: chase, program: chase_ur, earn: { base: 1 }, watch: false }

